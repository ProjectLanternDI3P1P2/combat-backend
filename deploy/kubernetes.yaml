# Everything Combat needs in the cluster. __TAG__ is replaced by cd.yaml with the
# release tag. Passwords come from the combat-backend Secret, created once by hand:
#   kubectl -n combat create secret generic combat-backend \
#     --from-literal=db-password='…' --from-literal=rabbitmq-password='…'
apiVersion: v1
kind: ConfigMap
metadata:
  name: combat-backend
  namespace: combat
data:
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: Host=combat-postgres;Port=5432;Database=combat;Username=combat
  ConnectionStrings__PasswordFile: /run/secrets/combat/db-password
  RabbitMq__Enabled: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: combat
  Grpc__Player__Address: http://player-backend.player:8081
---
# ClusterIP only: Traefik routes to http; grpc stays inside the cluster (ADR-GLOB-003).
apiVersion: v1
kind: Service
metadata:
  name: combat-backend
  namespace: combat
spec:
  selector:
    app: combat-backend
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combat-backend
  namespace: combat
spec:
  # One replica: CombatHub has no Redis backplane yet (ADR-GLOB-010).
  replicas: 1
  selector:
    matchLabels:
      app: combat-backend
  strategy:
    rollingUpdate:
      # The old pod keeps serving until the new one is ready.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: combat-backend
    spec:
      initContainers:
        # Same image, migrations only. A failure keeps the pod out of service and
        # the previous version running.
        - name: migrate
          image: ghcr.io/projectlanterndi3p1p2/combat-backend:__TAG__
          args: ["--migrate"]
          envFrom: &config
            - configMapRef:
                name: combat-backend
          volumeMounts: &secrets
            - name: secrets
              mountPath: /run/secrets/combat
              readOnly: true
      containers:
        - name: api
          image: ghcr.io/projectlanterndi3p1p2/combat-backend:__TAG__
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          envFrom: *config
          env:
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: combat-backend
                  key: rabbitmq-password
          volumeMounts: *secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: secrets
          secret:
            secretName: combat-backend

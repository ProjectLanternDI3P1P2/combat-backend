name: Build and scan image

on:
  workflow_call:
    inputs:
      upload_image:
        description: Export the scanned image for publication in this workflow run.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  image:
    name: Trivy image gate (CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Build the final runtime image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: combat-scanned:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            github_packages_credentials=Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic

      # Also reject CRITICAL vulnerabilities for which no fix is available.
      # Failure stops artifact export and the dependent publication job.
      - name: Reject CRITICAL vulnerabilities in the final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          scan-type: image
          image-ref: combat-scanned:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
          # Do not save caches from pull requests that delivery could later consume.
          cache: false

      - name: Export the scanned image
        if: inputs.upload_image
        shell: bash
        run: docker save "combat-scanned:${GITHUB_SHA}" | gzip -1 > scanned-image.tar.gz

      - name: Upload the scanned image
        if: inputs.upload_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combat-scanned-${{ github.run_id }}
          path: scanned-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

name: Security Scan

# push on main only — same reason as ci.yaml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  scan-image:
    name: Build and scan image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_image.yaml

  # Keep the existing required check name from the dev branch protection.
  trivy:
    name: Trivy Security Scan
    needs: scan-image
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful image scan
        env:
          SCAN_RESULT: ${{ needs.scan-image.result }}
        run: |
          if [ "$SCAN_RESULT" != "success" ]; then
            echo "Image build or CRITICAL vulnerability scan failed: $SCAN_RESULT" >&2
            exit 1
          fi

  zizmor:
    name: GitHub Actions audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # One-shot run: a cache would buy nothing and trips zizmor's own
          # cache-poisoning audit.
          enable-cache: false

      # Fails the build. Accepted trade-offs live in .github/zizmor.yml so that a new
      # finding stands out from the ones already argued about.
      - name: Audit workflows
        run: uvx --no-build zizmor@1.29.0 --config .github/zizmor.yml --min-severity low .github/workflows/

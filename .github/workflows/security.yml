name: Security Scan

# push on main only — same reason as ci.yaml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  trivy:
    name: Trivy Security Scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # exit-code 0: reports without blocking. Raise it to 1 once the backlog of
      # transitive findings is under control.
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  zizmor:
    name: GitHub Actions audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # One-shot run: a cache would buy nothing and trips zizmor's own
          # cache-poisoning audit.
          enable-cache: false

      # Fails the build. Accepted trade-offs live in .github/zizmor.yml so that a new
      # finding stands out from the ones already argued about.
      - name: Audit workflows
        run: uvx --no-build zizmor@1.29.0 --config .github/zizmor.yml --min-severity low .github/workflows/

# Local stack.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: combat
      POSTGRES_DB: combat
      # Sonar flags a committed password. No auth, so loopback-only.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combat -d combat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=combat;Username=combat"
    ports:
      - "8080:8080"
      # Internal gRPC endpoint. Do not expose this port in production Kubernetes ingress.
      - "127.0.0.1:8081:8081"

volumes:
  postgres-data:
